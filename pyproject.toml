[project]
name = "rtableaux"
version = "0.1.0"
description = "Witness comparison tableaux: a Python wrapper of decide-provability"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["lean-interact>=0.11", "pylatexenc>=2.10"]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

# The package is `rtableau`, not the project's name.
[tool.uv.build-backend]
module-name = "rtableau"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
