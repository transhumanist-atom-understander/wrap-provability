[project]
name = "gltableau"
version = "0.1.0"
description = "GL tableaux, checked by Lean: a Python wrapper of decide-provability and verify-provability"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["lean-interact>=0.11", "pylatexenc>=2.10"]

[project.scripts]
gl-tableau = "gltableau:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
