[project]
name = "gltableau"
version = "0.1.0"
description = "GL tableaux, checked by Lean: a Python wrapper of decide-provability and verify-provability"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["lean-interact>=0.11", "pylatexenc>=2.10"]

[project.scripts]
gl-tableau = "gltableau:main"
witness-tableau = "gltableau:witness"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
